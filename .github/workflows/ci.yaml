#
# GitHub actions for building and testing the Python version used by Pythia.
# Typically, Windows and macOS builds are on bare VMs .
# For Linux builds we use a container to allow building MUSL or ARM64.
#
# These jobs are preparing the OS, then building the Python package,
# run some tests and upload the result.
#
# Available list of runners:
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-where-workflows-run/choose-the-runner-for-a-job#choosing-github-hosted-runners
#
name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:

  linux:
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        # Alpine Linux 3.15 has musl 1.2.2, Amazon Linux 2 has glibc 2.26.
        container: [ 'alpine:3.15', 'amazonlinux:2' ]
    timeout-minutes: 60
    steps:

    # OpenSSL gets updated by apk, but that is the Alpine way, so it's fine.
    - name: Alpine setup
      if: startsWith(matrix.container, 'alpine')
      run: |
        apk upgrade -U
        apk add git curl bash lddtree shadow openssh-client file unzip musl-locales dejagnu sudo
        apk del util-linux-dev
        curl --output /usr/bin/paxctl https://bin.chevah.com:20443/third-party-stuff/alpine/paxctl-3.12
        chmod +x /usr/bin/paxctl
        echo "TARGET_ARCH=linux_musl-x64" >> $GITHUB_ENV

    - name: Amazon setup
      if: startsWith(matrix.container, 'amazonlinux')
      run: |
        yum -y upgrade
        yum -y install git-core dejagnu bzip2 sudo tar
        echo "TARGET_ARCH=linux-x64" >> $GITHUB_ENV

    # actions/checkout doesn't work on Amazon Linux 2, requires glibc 2.27.
    - name: Clone repo independently
      run: |
        git clone https://github.com/chevah/pythia.git
        cd pythia
        git checkout ${GITHUB_HEAD_REF}

    - name: Chevah user setup
      run: |
        useradd -g adm -s /bin/bash -m chevah
        echo '%adm    ALL=NOPASSWD: ALL' > /etc/sudoers

    - name: Build Pythia
      timeout-minutes: 30
      run: |
        chown -R chevah pythia
        cd pythia
        su chevah -c "./astral-to-pythia.sh $TARGET_ARCH"

    - name: Test Pythia
      timeout-minutes: 5
      run: |
        cd pythia
        su chevah -c "./test_pythia.sh $TARGET_ARCH"

    - name: Test compat
      timeout-minutes: 10
      env:
        USER: chevah
        CODECOV_TOKEN: local
      run: |
        cd pythia
        su chevah -c "./test_compat.sh"

    # Using `~/` is problematic under Docker, use `/root/`.
    # Remove key in same step to avoid leaving it on disk if publishing fails.
    - name: Upload testing package
      timeout-minutes: 5
      run: |
        mkdir -pv /root/.ssh/
        cd pythia
        touch priv_key
        chmod 600 priv_key
        echo "${{ secrets.SFTPPLUS_BIN_PRIV_KEY }}" > priv_key
        echo "${{ secrets.SFTPPLUS_BIN_HOST_KEY }}" > /root/.ssh/known_hosts
        ./publish_dist.sh ; rm priv_key

    # If one of the above steps fails, fire up tmate for remote debugging.
    # Not all platforms are supported by tmate.
    # Currently not supported: Alpine, Amazon 2, CentOS 5 (no glibc or too old).
    - name: Tmate debug on failure
      if: ${{ !cancelled() && runner.debug }}
      uses: chevah/action-tmate@v3
      with:
        sudo: false
        limit-access-to-actor: true


  linux-arm64:
    runs-on: ubuntu-24.04-arm
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        # Amazon Linux 2 has glibc 2.26.
        container: [ 'amazonlinux:2' ]
    timeout-minutes: 60
    steps:

    - name: Amazon setup
      run: |
        yum -y upgrade
        yum -y install git-core dejagnu bzip2 sudo tar unzip

    # actions/checkout doesn't work on Amazon Linux 2, requires glibc 2.27.
    - name: Clone repo independently
      run: |
        git clone https://github.com/chevah/pythia.git
        cd pythia
        git checkout ${GITHUB_HEAD_REF}

    - name: Chevah user setup
      run: |
        useradd -g adm -s /bin/bash -m chevah
        echo '%adm    ALL=NOPASSWD: ALL' > /etc/sudoers

    - name: Build Pythia
      timeout-minutes: 30
      run: |
        chown -R chevah pythia
        cd pythia
        su chevah -c "./astral-to-pythia.sh linux-arm64"

    - name: Test Pythia
      timeout-minutes: 5
      run: |
        cd pythia
        su chevah -c "./test_pythia.sh linux-arm64"

    - name: Test compat
      timeout-minutes: 10
      env:
        USER: chevah
        CODECOV_TOKEN: local
      run: |
        cd pythia
        su chevah -c "./test_compat.sh"

    # Using `~/` is problematic under Docker, use `/root/`.
    # Remove key in same step to avoid leaving it on disk if publishing fails.
    - name: Upload testing package
      timeout-minutes: 5
      run: |
        mkdir -pv /root/.ssh/
        cd pythia
        touch priv_key
        chmod 600 priv_key
        echo "${{ secrets.SFTPPLUS_BIN_PRIV_KEY }}" > priv_key
        echo "${{ secrets.SFTPPLUS_BIN_HOST_KEY }}" > /root/.ssh/known_hosts
        ./publish_dist.sh ; rm priv_key

    # If one of the above steps fails, fire up tmate for remote debugging.
    # Not all platforms are supported by tmate.
    # Currently not supported: Alpine, Amazon 2, CentOS 5 (no glibc or too old).
    - name: Tmate debug on failure
      if: ${{ !cancelled() && runner.debug }}
      uses: chevah/action-tmate@v3
      with:
        sudo: false
        limit-access-to-actor: true


  windows:
    # The type of runner that the job will run on
    runs-on: windows-latest
    timeout-minutes: 45

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit requirements.txt
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Checks-out the repository under $GITHUB_WORKSPACE, so the job can access it
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    # Explicitly run our scripts with Bash, not PowerShell (GitHub's default).
    - name: Build Pythia
      timeout-minutes: 10
      run: bash ./astral-to-pythia.sh windows-x64

    - name: Test Pythia
      timeout-minutes: 5
      run: bash ./test_pythia.sh windows-x64

    - name: Test compat
      timeout-minutes: 10
      env:
        USER: runneradmin
        CODECOV_TOKEN: local
      run: bash ./test_compat.sh

    # Commit changed requirements.txt back to the repository
    - uses: chevah/git-auto-commit-action@HEAD
      with:
        commit_message: Automated update of requirements.txt from Windows build.
        file_pattern: 'requirements.txt'

    # To use an RSA key with SFTPPlus, install upstream OpenSSH package,
    # which is more finicky in regards to file permissions.
    # Beware the commands in this step run under PowerShell.
    - name: Prepare SFTP upload
      run: |
        mkdir -p ~/.ssh/
        touch priv_key
        icacls .\priv_key /inheritance:r
        icacls .\priv_key /grant:r runneradmin:"(F)"
        echo "${{ secrets.SFTPPLUS_BIN_PRIV_KEY }}" > priv_key
        echo "${{ secrets.SFTPPLUS_BIN_HOST_KEY }}" > ~/.ssh/known_hosts
        choco install --yes --no-progress openssh

    # Upload using a (per-OS selected) sftp command, then show final links.
    # Remove key in same step to avoid leaving it on disk if publishing fails.
    - name: Upload testing package
      timeout-minutes: 5
      run: bash -c './publish_dist.sh ; rm priv_key'

    - name: Tmate debug on failure
      if: ${{ !cancelled() && runner.debug }}
      uses: chevah/action-tmate@v3
      with:
        limit-access-to-actor: true

    # To access the Windows desktop for advanced debugging, as per
    # https://github.com/nelsonjchen/reverse-rdp-windows-github-actions,
    # but using the ngrok token as password for the runnneradmin user.
    # Basically use the ngrok token and the ngrok URL (from ngrok's dashboard).
    - name: Ngrok debugging on failure
      if: ${{ failure() && !cancelled() && runner.debug }}
      env:
        NGROK_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        choco install --yes --no-progress ngrok
        ngrok.exe authtoken $env:NGROK_TOKEN
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server'-name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1
        Set-LocalUser -Name "runneradmin" -Password (ConvertTo-SecureString -AsPlainText "$env:NGROK_TOKEN" -Force)
        ngrok.exe tcp 3389


  macos:
    # For macOS on Intel at GitHub.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    # Some Homebrew libs pollute the build.
    # Also make sure binaries depending on these libs are out of the way.
    - name: Hack Homebrew
      run: |
        sudo mv -v /usr/local/bin/git{,.saved}
        sudo chmod -v a-r /usr/local/include/libintl.h
        sudo chmod -v a-r /usr/local/include/gdbm.h
        sudo chmod -v a-r /usr/local/opt/gettext/lib/libintl.*
        sudo chmod -v a-r /usr/local/opt/gdbm/lib/libgdbm*
        sudo chmod -v a-r /usr/local/opt/mpdecimal/lib/libmpdec*

    - name: Build Pythia
      timeout-minutes: 30
      run: ./astral-to-pythia.sh macos-x64

    # Fix back Homebrew, for working Shellcheck tests and tmate debugging.
    - name: Unhack Homebrew
      run: |
        sudo chmod -v a+r /usr/local/include/libintl.h
        sudo chmod -v a-r /usr/local/include/gdbm.h
        sudo chmod -v a+r /usr/local/opt/gettext/lib/libintl*
        sudo chmod -v a+r /usr/local/opt/gdbm/lib/libgdbm*
        sudo chmod -v a+r /usr/local/opt/mpdecimal/lib/libmpdec*
        sudo mv -v /usr/local/bin/git{.saved,}

    - name: Test Pythia
      timeout-minutes: 5
      run: ./test_pythia.sh macos-x64

    - name: Test compat
      timeout-minutes: 10
      env:
        CODECOV_TOKEN: local
      run: ./test_compat.sh

    - name: Upload testing package
      timeout-minutes: 5
      run: |
        mkdir -pv ~/.ssh/
        touch priv_key
        chmod 600 priv_key
        echo "${{ secrets.SFTPPLUS_BIN_PRIV_KEY }}" > priv_key
        echo "${{ secrets.SFTPPLUS_BIN_HOST_KEY }}" > ~/.ssh/known_hosts
        ./publish_dist.sh ; rm priv_key

    - name: Tmate debug on failure
      if: ${{ !cancelled() && runner.debug }}
      uses: chevah/action-tmate@v3
      with:
        limit-access-to-actor: true


  macos-m1:
    # For macOS on Apple Silicon at GitHub.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Build Pythia
      timeout-minutes: 20
      run: ./astral-to-pythia.sh macos-arm64

    - name: Test Pythia
      timeout-minutes: 5
      run: ./test_pythia.sh macos-arm64

    - name: Test compat
      timeout-minutes: 10
      env:
        CODECOV_TOKEN: local
      run: ./test_compat.sh

    - name: Upload testing package
      timeout-minutes: 5
      run: |
        mkdir -pv ~/.ssh/
        touch priv_key
        chmod 600 priv_key
        echo "${{ secrets.SFTPPLUS_BIN_PRIV_KEY }}" > priv_key
        echo "${{ secrets.SFTPPLUS_BIN_HOST_KEY }}" > ~/.ssh/known_hosts
        ./publish_dist.sh ; rm priv_key

    - name: Tmate debug on failure
      if: ${{ !cancelled() && runner.debug }}
      uses: chevah/action-tmate@v3
      with:
        limit-access-to-actor: true
